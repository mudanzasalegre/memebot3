name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: "1"
      LIVE_CANARY_ENABLED: "false"
      AUTO_PROMOTE_LIVE: "false"
      MODEL_AUTO_PROMOTE: "false"
      ML_AUTO_PROMOTE_LANES: "false"
      ALLOW_LIVE_POLICY_ENFORCE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pip check
      - name: Native dependency and source import smoke
        run: python -c "import numpy, pandas, pyarrow; import features.builder; print('native_data_imports=ok', numpy.__version__, pandas.__version__, pyarrow.__version__)"
      - name: Native signing SDK import smoke
        run: python -c "from solana.rpc.api import Client; from solana.rpc.types import TxOpts; from solders.transaction import VersionedTransaction; print('native_sdk_imports=ok')"
      - name: Guarded source-only PAPER lifecycle smoke
        run: python -m pytest -q tests/test_native_paper_lifecycle.py::test_native_no_log_preserves_an_explicit_launcher_identity
      - run: python -m pytest -q
      - run: python tools/ml_status.py --no-fail-if-missing-model
      - run: python backtest/replay.py --policy rules_only --no-fail-if-no-data
